name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait for the running one rather than cancel it, so a
# half-finished upload never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # The prebuilt binary; `cargo install wasm-pack` compiles it from source
        # and costs well over a minute.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build simulation core
        # The artifact is gitignored, so the deployed site only gets the WASM
        # backend if CI produces it. Without this the app silently falls back to
        # the TypeScript integrator.
        run: npm run wasm

      - name: Build static export
        run: npm run build
        env:
          # Project pages are served from /<repo>, so every asset needs the prefix.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Disable Jekyll processing
        # Without this, GitHub Pages strips the _next directory.
        run: touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on rather than failing when it has never been configured,
          # which is the state every fresh fork of this repository starts in.
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
