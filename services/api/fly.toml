app = "neuroforge-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Streaming responses must not be buffered or the plan arrives all at once.
[http_service.http_options]
  h2_backend = false

[checks.health]
  type = "http"
  port = 8080
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
